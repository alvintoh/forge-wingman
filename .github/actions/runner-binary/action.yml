# Puts the runner binary at $RUNNER_TEMP/runner: the one run.yml's ticket job built and
# uploaded, if it matches the checksum that job reported, and otherwise a build of this
# checkout. The build is static, so the egress proxy container can run the binary it mounts.
name: runner-binary
description: Downloads the run's runner binary and verifies its checksum, building it here when the download is missing or does not match.
inputs:
  sha256:
    description: the checksum the ticket job reported for the binary it uploaded
    required: true
runs:
  using: composite
  steps:
    - id: download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: runner
        path: ${{ runner.temp }}

    - id: verify
      if: steps.download.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        SHA256: ${{ inputs.sha256 }}
      run: |
        echo "$SHA256  $RUNNER_TEMP/runner" | sha256sum --check --strict - || {
          echo "::warning::the shared runner binary does not match the ticket job's checksum; building it here"
          exit 1
        }
        chmod +x "$RUNNER_TEMP/runner"

    - if: steps.verify.outcome != 'success'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - if: steps.verify.outcome != 'success'
      shell: bash
      env:
        CGO_ENABLED: "0"
      run: go build -o "$RUNNER_TEMP/runner" ./cmd/runner
