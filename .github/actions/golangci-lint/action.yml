# Installs the pinned golangci-lint release into ~/.local/bin and puts it on PATH.
# The release is static, so the checks container can also run the binary it mounts.
# ci.yml's golangci-lint-action version is the same version. The binary is built with
# Go 1.27.0, so go.mod's `go` line moving past it needs a newer release here.
#
# The release download can answer 504 for many minutes, so it is retried for up to five,
# then the same archive is fetched from the project's tools bucket (infra/storage.tf),
# which needs no credentials. Either way the checksum is checked before extraction. A new
# version needs its archive uploaded there too (infra/README.md, "Tools mirror").
name: golangci-lint
description: Installs the pinned golangci-lint release and verifies its checksum.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: 2.13.2
        SHA256: 2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6
        MIRROR: https://storage.googleapis.com/forge-wingman-tools
      run: |
        archive="golangci-lint-${VERSION}-linux-amd64"
        tarball="$RUNNER_TEMP/$archive.tar.gz"
        if ! curl -fsSL --retry 10 --retry-all-errors --retry-max-time 300 -o "$tarball" \
          "https://github.com/golangci/golangci-lint/releases/download/v${VERSION}/$archive.tar.gz"; then
          echo "::warning::the golangci-lint release download failed; fetching it from the tools bucket"
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 -o "$tarball" \
            "$MIRROR/$archive.tar.gz"
        fi
        echo "$SHA256  $tarball" | sha256sum --check --strict -
        mkdir -p "$HOME/.local/bin"
        tar -xzf "$tarball" -C "$HOME/.local/bin" --strip-components=1 "$archive/golangci-lint"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/golangci-lint" version
