# The model's half of a run: fetch the projection, run opencode, upload its completions,
# then commit and bundle what it changed. Its identity may read projections and create
# completions, and nothing else, so it cannot write or overwrite a run record. The
# record job validates the summary this emits and writes the record.
# Needs the GCP_WIF_PROVIDER and GCP_MODEL_SERVICE_ACCOUNT variables (infra/README.md).
name: model

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
    secrets:
      OPENCODE_API_KEY:
        required: true
    outputs:
      record_id:
        value: ${{ jobs.build.outputs.record_id }}
      branch:
        value: ${{ jobs.build.outputs.branch }}
      changed:
        value: ${{ jobs.build.outputs.changed }}
      summary:
        value: ${{ jobs.build.outputs.summary }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      record_id: ${{ steps.build.outputs.record_id }}
      branch: ${{ steps.build.outputs.branch }}
      changed: ${{ steps.build.outputs.changed }}
      summary: ${{ steps.build.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go build -o "$RUNNER_TEMP/runner" ./cmd/runner

      - name: Install opencode
        env:
          OPENCODE_VERSION: 1.18.30
          OPENCODE_SHA256: 55007246858165496ff85ba1c2b648f7421e8e2013bf4189a680c9ff8e699d17
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opencode.tar.gz" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/bin" opencode
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bin/opencode" --version)" = "${OPENCODE_VERSION}"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MODEL_SERVICE_ACCOUNT }}

      - id: build
        name: Build
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          MODEL: ${{ inputs.model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: '"$RUNNER_TEMP/runner" build -model "$MODEL"'

      # wingman.bundle here and in run.yml's pr job is bundleName in internal/runner/build.go.
      - if: steps.build.outputs.changed == 'true'
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: git -c core.hooksPath=/dev/null -c core.fsmonitor=false bundle verify --quiet "$RUNNER_TEMP/wingman.bundle"

      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}/wingman.bundle
          if-no-files-found: error
          retention-days: 1
