# The model's half of a run: fetch the projection, run the agent, upload its completions,
# then commit and bundle what it changed. Its identity may read projections and create
# completions, and nothing else, so it cannot read or write a run record: the ticket
# arrives as an artifact run.yml's ticket job uploads — never a job output, which GitHub
# drops when the text matches a value masked in that job — and the record job validates
# the summary this emits and writes the record. No GitHub token reaches the model's environment.
# With `stage: plan` (FRG-33) the agent runs the plan phase alone and uploads its file list
# as the `plan` artifact for run.yml's trusted record-plan-stage job instead.
# Needs the GCP_WIF_PROVIDER, GCP_MODEL_SERVICE_ACCOUNT and WINGMAN_ACCOUNT variables and
# the COMMANDCODE_API_KEY secret (infra/README.md), which both harnesses run on.
# The WINGMAN_AGENT_IMAGE variable (an image pinned by digest providing omp, git and sh) is required:
# the build and plan stages run the agent CLIs in a container that mounts only the worktree,
# harness home and git directory, and refuse to start without it.
name: model

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      # review_models is the pre-PR loop's review pass (FR-28), FR-14 configuration, ordered like
      # plan_models: the first entry is the main model and later ones are backups for when it is
      # unavailable or out of allowance. None may be the build model, so the review is never the
      # builder checking its own work.
      review_models:
        type: string
        required: true
      # plan_models is the plan phase's ordered list, kept apart from model: the first entry is the
      # main model and later ones are backups for when it is unavailable or out of allowance.
      plan_models:
        type: string
        required: true
      # stage is the two-stage dispatch's phase (FRG-33): `plan` runs the plan phase alone under the
      # read-only profile and uploads its file list, `build` builds from a plan already recorded.
      stage:
        type: string
        required: true
      # runner_sha256 is the checksum run.yml's ticket job reported for the runner binary it uploaded.
      runner_sha256:
        type: string
        required: true
    secrets:
      # The plan's key: omp runs on it.
      COMMANDCODE_API_KEY:
        required: true
      # The free-tier plan's key, read only when a run falls through to it; not
      # required until the owner sets it (infra/README.md).
      GEMINI_API_KEY:
        required: false
    outputs:
      attempt_id:
        value: ${{ jobs.build.outputs.attempt_id }}
      branch:
        value: ${{ jobs.build.outputs.branch }}
      changed:
        value: ${{ jobs.build.outputs.changed }}
      summary:
        value: ${{ jobs.build.outputs.summary }}
      # loop_detail names why the pre-PR loop left the PR a draft.
      loop_detail:
        value: ${{ jobs.build.outputs.loop_detail }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # NFR-1's whole-run ceiling. internal/runner/loop.go's nfr1RunCap is the
    # other half — raise both together.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      # The pre-PR checks run in this image: go.mod's toolchain version, pinned by digest.
      CHECKS_IMAGE: golang:1.27.1@sha256:162be5298a40ed317005c8339c6de4d10d3eef336d66dc8e9259b03ab9d3a6d2
    outputs:
      attempt_id: ${{ steps.build.outputs.attempt_id }}
      branch: ${{ steps.build.outputs.branch }}
      changed: ${{ steps.build.outputs.changed }}
      summary: ${{ steps.build.outputs.summary }}
      loop_detail: ${{ steps.build.outputs.loop_detail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/runner-binary
        with:
          sha256: ${{ inputs.runner_sha256 }}

      # The pre-PR loop (FR-28) runs the same four gates as run.yml's check job, in-job, first.
      - uses: ./.github/actions/golangci-lint

      # WINGMAN_AGENT_IMAGE is the agent image, pinned by digest. The build and plan stages
      # refuse to start without it. The two pulls overlap; a failed pull fails the step.
      - name: Pull the checks and agent images
        run: |
          docker pull "$CHECKS_IMAGE" & checks=$!
          docker pull "$AGENT_IMAGE" & agent=$!
          wait "$checks"
          wait "$agent"
        env:
          AGENT_IMAGE: ${{ vars.WINGMAN_AGENT_IMAGE }}

      # omp is every model slot's default harness; it needs bun >= 1.3.14 (its
      # package.json engines field), and tools/omp's lockfile pins it and every
      # dependency it installs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install omp
        run: |
          bun install --frozen-lockfile --cwd tools/omp
          echo "$GITHUB_WORKSPACE/tools/omp/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(tools/omp/node_modules/.bin/omp --version)" = "omp/$(jq -r '.dependencies["@oh-my-pi/pi-coding-agent"]' tools/omp/package.json)"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MODEL_SERVICE_ACCOUNT }}

      # A missing artifact must not fail this step: build then finds no file and
      # records ticket-not-delivered, which names the hand-off.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ticket
          path: ${{ runner.temp }}

      - id: build
        name: Build
        if: inputs.stage != 'plan'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          MODEL: ${{ inputs.model }}
          REVIEW_MODELS: ${{ inputs.review_models }}
          PLAN_MODELS: ${{ inputs.plan_models }}
          AGENT_IMAGE: ${{ vars.WINGMAN_AGENT_IMAGE }}
          AGENT_EGRESS: ${{ vars.WINGMAN_AGENT_EGRESS }}
          WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: '"$RUNNER_TEMP/runner" build -model "$MODEL" -review-models "$REVIEW_MODELS" -plan-models "$PLAN_MODELS" -ticket-file "$RUNNER_TEMP/ticket.json" -checks-image "$CHECKS_IMAGE" -agent-image "$AGENT_IMAGE" -agent-egress "$AGENT_EGRESS"'

      # The plan stage (FRG-33) runs the plan phase alone, under the plan profile's read-only
      # harnesses; the plan artifact travels to the trusted record-plan-stage job, which re-checks it.
      - id: plan
        name: Plan
        if: inputs.stage == 'plan'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          PLAN_MODELS: ${{ inputs.plan_models }}
          AGENT_IMAGE: ${{ vars.WINGMAN_AGENT_IMAGE }}
          AGENT_EGRESS: ${{ vars.WINGMAN_AGENT_EGRESS }}
          WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: '"$RUNNER_TEMP/runner" plan-stage -plan-models "$PLAN_MODELS" -ticket-file "$RUNNER_TEMP/ticket.json" -out "$RUNNER_TEMP/plan.json" -agent-image "$AGENT_IMAGE" -agent-egress "$AGENT_EGRESS"'

      - if: inputs.stage == 'plan'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
          retention-days: 1

      # wingman.bundle here and in run.yml's check, pr-meta and pr jobs is bundleName in internal/runner/build.go.
      - if: steps.build.outputs.changed == 'true'
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: git -c core.hooksPath=/dev/null -c core.fsmonitor=false bundle verify --quiet "$RUNNER_TEMP/wingman.bundle"

      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}/wingman.bundle
          if-no-files-found: error
          retention-days: 1

      # Removes any egress network or proxy a killed job left behind.
      - if: always()
        run: |
          docker ps --all --quiet --filter name=wingman-egress-proxy- | xargs -r docker rm --force
          docker network ls --quiet --filter name=wingman-egress-net- | xargs -r docker network rm
