# The model's half of a run: fetch the projection, run the agent, upload its completions,
# then commit and bundle what it changed. Its identity may read projections and create
# completions, and nothing else, so it cannot read or write a run record: the ticket
# arrives as an artifact run.yml's ticket job uploads — never a job output, which GitHub
# drops when the text matches a value masked in that job — and the record job validates
# the summary this emits and writes the record. No GitHub token reaches the model's environment.
# Needs the GCP_WIF_PROVIDER, GCP_MODEL_SERVICE_ACCOUNT and WINGMAN_ACCOUNT variables and
# the COMMANDCODE_API_KEY secret (infra/README.md), which both harnesses run on.
name: model

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      # review_models is the pre-PR loop's review pass (FR-28), FR-14 configuration, ordered like
      # plan_models: the first entry is the main model and later ones are backups for when it is
      # unavailable or out of allowance. None may be the build model, so the review is never the
      # builder checking its own work.
      review_models:
        type: string
        required: true
      # plan_models is the plan phase's ordered list, kept apart from model: the first entry is the
      # main model and later ones are backups for when it is unavailable or out of allowance.
      plan_models:
        type: string
        required: true
    secrets:
      # The plan's key: omp, and its opencode fallback, run on it.
      COMMANDCODE_API_KEY:
        required: true
    outputs:
      attempt_id:
        value: ${{ jobs.build.outputs.attempt_id }}
      branch:
        value: ${{ jobs.build.outputs.branch }}
      changed:
        value: ${{ jobs.build.outputs.changed }}
      summary:
        value: ${{ jobs.build.outputs.summary }}
      # ready and loop_detail are the pre-PR loop's draft-vs-ready decision
      # (FR-5): ready is true only once the checks passed and the review
      # found nothing open; loop_detail names why not.
      ready:
        value: ${{ jobs.build.outputs.ready }}
      loop_detail:
        value: ${{ jobs.build.outputs.loop_detail }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      # The pre-PR checks run in this image: go.mod's toolchain version, pinned by digest.
      CHECKS_IMAGE: golang:1.27.1@sha256:162be5298a40ed317005c8339c6de4d10d3eef336d66dc8e9259b03ab9d3a6d2
    outputs:
      attempt_id: ${{ steps.build.outputs.attempt_id }}
      branch: ${{ steps.build.outputs.branch }}
      changed: ${{ steps.build.outputs.changed }}
      summary: ${{ steps.build.outputs.summary }}
      ready: ${{ steps.build.outputs.ready }}
      loop_detail: ${{ steps.build.outputs.loop_detail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go build -o "$RUNNER_TEMP/runner" ./cmd/runner

      # The version is ci.yml's golangci-lint-action version, and run.yml's check
      # job's — the pre-PR loop (FR-28) runs the same four gates in-job, first.
      # Static, so the checks container can run the binary it mounts.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
        env:
          CGO_ENABLED: "0"

      - name: Pull the checks image
        run: docker pull "$CHECKS_IMAGE"

      # omp is every model slot's default harness; it needs bun >= 1.3.14 (its
      # package.json engines field), and tools/omp's lockfile pins it and every
      # dependency it installs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install omp
        run: |
          bun install --frozen-lockfile --cwd tools/omp
          echo "$GITHUB_WORKSPACE/tools/omp/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(tools/omp/node_modules/.bin/omp --version)" = "omp/$(jq -r '.dependencies["@oh-my-pi/pi-coding-agent"]' tools/omp/package.json)"

      # opencode is every model slot's fallback harness; npm installs it, and
      # tools/opencode's lockfile pins it and the platform binary it installs,
      # each checked against its recorded integrity.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install opencode
        run: |
          npm ci --prefix tools/opencode --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/opencode/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(tools/opencode/node_modules/.bin/opencode --version)" = "$(jq -r '.dependencies["opencode-ai"]' tools/opencode/package.json)"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MODEL_SERVICE_ACCOUNT }}

      # A missing artifact must not fail this step: build then finds no file and
      # records ticket-not-delivered, which names the hand-off.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: ticket
          path: ${{ runner.temp }}

      - id: build
        name: Build
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          MODEL: ${{ inputs.model }}
          REVIEW_MODELS: ${{ inputs.review_models }}
          PLAN_MODELS: ${{ inputs.plan_models }}
          WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
        run: '"$RUNNER_TEMP/runner" build -model "$MODEL" -review-models "$REVIEW_MODELS" -plan-models "$PLAN_MODELS" -ticket-file "$RUNNER_TEMP/ticket.json" -checks-image "$CHECKS_IMAGE"'

      # wingman.bundle here and in run.yml's check and pr jobs is bundleName in internal/runner/build.go.
      - if: steps.build.outputs.changed == 'true'
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: git -c core.hooksPath=/dev/null -c core.fsmonitor=false bundle verify --quiet "$RUNNER_TEMP/wingman.bundle"

      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}/wingman.bundle
          if-no-files-found: error
          retention-days: 1
