# The model's half of a run: fetch the projection, run the agent, upload its completions,
# then commit and bundle what it changed. Its identity may read projections and create
# completions, and nothing else, so it cannot read or write a run record: the ticket
# arrives as an input from run.yml's ticket job, and the record job validates the
# summary this emits and writes the record. No GitHub token reaches the model's environment.
# Needs the GCP_WIF_PROVIDER, GCP_MODEL_SERVICE_ACCOUNT, WINGMAN_ACCOUNT and
# COMMAND_CODE_OPT_IN variables (infra/README.md).
name: model

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      # review_models is the pre-PR loop's review pass (FR-28), FR-14 configuration, ordered like
      # plan_models: the first entry is the main model and later ones are backups for when it is
      # unavailable or out of allowance. None may be the build model, so the review is never the
      # builder checking its own work.
      review_models:
        type: string
        required: true
      # plan_models is the plan phase's ordered list, kept apart from model: the first entry is the
      # main model and later ones are backups for when it is unavailable or out of allowance.
      plan_models:
        type: string
        required: true
      ticket:
        type: string
        required: true
    secrets:
      # Only an explicitly labelled opencode model needs this; every default is command-code.
      OPENCODE_API_KEY:
        required: false
      # Every default model routes through this harness.
      COMMANDCODE_API_KEY:
        required: true
    outputs:
      attempt_id:
        value: ${{ jobs.build.outputs.attempt_id }}
      branch:
        value: ${{ jobs.build.outputs.branch }}
      changed:
        value: ${{ jobs.build.outputs.changed }}
      summary:
        value: ${{ jobs.build.outputs.summary }}
      # ready and loop_detail are the pre-PR loop's draft-vs-ready decision
      # (FR-5): ready is true only once the checks passed and the review
      # found nothing open; loop_detail names why not.
      ready:
        value: ${{ jobs.build.outputs.ready }}
      loop_detail:
        value: ${{ jobs.build.outputs.loop_detail }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      attempt_id: ${{ steps.build.outputs.attempt_id }}
      branch: ${{ steps.build.outputs.branch }}
      changed: ${{ steps.build.outputs.changed }}
      summary: ${{ steps.build.outputs.summary }}
      ready: ${{ steps.build.outputs.ready }}
      loop_detail: ${{ steps.build.outputs.loop_detail }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go build -o "$RUNNER_TEMP/runner" ./cmd/runner

      # The version is ci.yml's golangci-lint-action version, and run.yml's check
      # job's — the pre-PR loop (FR-28) runs the same four gates in-job, first.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Install opencode
        env:
          OPENCODE_VERSION: 1.18.30
          OPENCODE_SHA256: 55007246858165496ff85ba1c2b648f7421e8e2013bf4189a680c9ff8e699d17
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opencode.tar.gz" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/bin" opencode
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bin/opencode" --version)" = "${OPENCODE_VERSION}"

      # Installed only when the run is opted into the harness, so a run that never
      # uses it carries neither the package nor its registry dependency. The CLI
      # needs Node 22 or later (its package.json engines field).
      - if: vars.COMMAND_CODE_OPT_IN == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # tools/command-code's lockfile pins the CLI and every dependency it
      # installs, each checked against its recorded integrity.
      - name: Install command-code
        if: vars.COMMAND_CODE_OPT_IN == 'true'
        run: |
          npm ci --prefix tools/command-code --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/command-code/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(tools/command-code/node_modules/.bin/cmd --version)" = "$(jq -r '.dependencies["command-code"]' tools/command-code/package.json)"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MODEL_SERVICE_ACCOUNT }}

      - id: build
        name: Build
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          MODEL: ${{ inputs.model }}
          REVIEW_MODELS: ${{ inputs.review_models }}
          PLAN_MODELS: ${{ inputs.plan_models }}
          TICKET: ${{ inputs.ticket }}
          WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
          COMMAND_CODE_OPT_IN: ${{ vars.COMMAND_CODE_OPT_IN }}
        run: '"$RUNNER_TEMP/runner" build -model "$MODEL" -review-models "$REVIEW_MODELS" -plan-models "$PLAN_MODELS" -ticket "$TICKET"'

      # wingman.bundle here and in run.yml's check and pr jobs is bundleName in internal/runner/build.go.
      - if: steps.build.outputs.changed == 'true'
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: git -c core.hooksPath=/dev/null -c core.fsmonitor=false bundle verify --quiet "$RUNNER_TEMP/wingman.bundle"

      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}/wingman.bundle
          if-no-files-found: error
          retention-days: 1
