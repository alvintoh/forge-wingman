# Twice a week, probes every free Zen model against the fixture ticket and, when the
# default model set changes, opens a PR that edits only internal/runner/models.json and
# that run's file under probe/results/; every run keeps its results as an artifact.
# Merging that PR is the change of default model; reverting it is the undo.
# `probe` holds the model API key and no GitHub token, since the models it runs have a
# shell; `pr` holds the App token and never runs a model. Needs the OPENCODE_API_KEY and
# WINGMAN_APP_PRIVATE_KEY secrets and the WINGMAN_APP_ID variable.
name: probe-models

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      results: ${{ steps.probe.outputs.results }}
      changed: ${{ steps.probe.outputs.changed }}
      free: ${{ steps.probe.outputs.free }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go build -o "$RUNNER_TEMP/modelprobe" ./cmd/modelprobe

      # The version and checksum are model.yml's.
      - name: Install opencode
        env:
          OPENCODE_VERSION: 1.18.30
          OPENCODE_SHA256: 55007246858165496ff85ba1c2b648f7421e8e2013bf4189a680c9ff8e699d17
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opencode.tar.gz" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/bin" opencode
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bin/opencode" --version)" = "${OPENCODE_VERSION}"

      - id: probe
        name: Probe the free models
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: '"$RUNNER_TEMP/modelprobe" -run-id "$GITHUB_RUN_ID" -outputs "$GITHUB_OUTPUT"'

      - name: Stage the outputs
        env:
          RESULTS: ${{ steps.probe.outputs.results }}
        run: |
          mkdir -p "$RUNNER_TEMP/out/results"
          cp internal/runner/models.json "$RUNNER_TEMP/out/models.json"
          cp "$RESULTS" "$RUNNER_TEMP/out/results/"

      # Kept whether or not the default changes: the results file is the record of the run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-output
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30

  pr:
    needs: probe
    if: needs.probe.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      # The same App token run.yml's pr job mints, for the same reason: a PR opened with
      # GITHUB_TOKEN does not start its own checks.
      - id: app-token
        name: Mint the App's installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.WINGMAN_APP_ID }}
          private-key: ${{ secrets.WINGMAN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: go build -o "$RUNNER_TEMP/modelprobe" ./cmd/modelprobe

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probe-output
          path: ${{ runner.temp }}/out

      # The probe job ran models with a shell, so its output is verified before it is used:
      # modelprobe checks the models against the results and the roster, and writes the
      # PR body itself rather than taking one from the probe job.
      - name: Verify and apply the outputs
        env:
          FREE: ${{ needs.probe.outputs.free }}
        run: |
          out="$RUNNER_TEMP/out"
          shopt -s nullglob
          results=("$out"/results/*)
          [[ ${#results[@]} -eq 1 && "$(basename "${results[0]}")" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[A-Za-z0-9]+\.json$ ]] || { echo "unexpected results"; exit 1; }
          "$RUNNER_TEMP/modelprobe" -verify "${results[0]}" -models "$out/models.json" -free "$FREE" -summary "$RUNNER_TEMP/summary.md"
          cp "$out/models.json" internal/runner/models.json
          mkdir -p probe/results
          cp "${results[0]}" probe/results/
          [[ -z "$(git status --porcelain | grep -Ev '^( M|\?\?) (internal/runner/models\.json|probe/results/)')" ]] \
            || { echo "unexpected changes"; git status --porcelain; exit 1; }

      - id: open
        name: Open the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          date=$(date -u +%F)
          branch="models/probe-${date}-${GITHUB_RUN_ID}"
          git checkout -q -b "$branch"
          git add internal/runner/models.json probe/results
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(models): probe results ${date}"
          git push origin "refs/heads/${branch}"
          gh pr create --base main --head "$branch" --title "chore(models): probe results ${date}" \
            --body-file "$RUNNER_TEMP/summary.md"
