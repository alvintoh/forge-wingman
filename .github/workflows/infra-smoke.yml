# Proves both keyless credentials end to end: GitHub OIDC -> Workload Identity Federation
# -> a service account. `claims` prints the token claims the bindings match on, for a
# direct job here and for a reusable-workflow job in model-smoke.yml. `smoke` calls each
# store the runner may use; `model` proves what the model's account may and may not do.
# Needs three repository variables, all OpenTofu outputs from infra/:
#   GCP_WIF_PROVIDER           workload_identity_provider
#   GCP_SERVICE_ACCOUNT        runner_service_account
#   GCP_MODEL_SERVICE_ACCOUNT  model_service_account
# The project and bucket names derive from the service account, as infra/storage.tf names them.
name: infra-smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/oidc-claims
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          expected_job_workflow_ref: ${{ github.repository }}/.github/workflows/infra-smoke.yml@${{ github.ref }}

  model:
    uses: ./.github/workflows/model-smoke.yml
    permissions:
      contents: read
      id-token: write

  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Firestore write and delete
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ steps.auth.outputs.project_id }}
          DOC_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          base="https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/smoke"
          curl --fail-with-body -sS -X POST "${base}?documentId=${DOC_ID}" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d '{"fields":{"source":{"stringValue":"infra-smoke"}}}'
          curl --fail-with-body -sS -X DELETE "${base}/${DOC_ID}" -H "Authorization: Bearer ${TOKEN}"

      - name: Write to completions
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ steps.auth.outputs.project_id }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        # The JSON API create the runner will use: ifGenerationMatch=0 needs only create.
        run: |
          curl --fail-with-body -sS -X POST \
            "https://storage.googleapis.com/upload/storage/v1/b/${PROJECT}-completions/o?uploadType=media&name=smoke%2F${RUN_ID}.txt&ifGenerationMatch=0" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: text/plain" \
            --data-binary "infra-smoke ${RUN_ID}"

      - name: List projections
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          curl --fail-with-body -sS \
            "https://storage.googleapis.com/storage/v1/b/${PROJECT}-projections/o" \
            -H "Authorization: Bearer ${TOKEN}"
