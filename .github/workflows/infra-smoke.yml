# Proves the runner's keyless credential end to end: GitHub OIDC -> Workload Identity
# Federation -> the runner service account, then one call against each store it may use.
# Needs two repository variables, both OpenTofu outputs from infra/:
#   GCP_WIF_PROVIDER     workload_identity_provider
#   GCP_SERVICE_ACCOUNT  runner_service_account
# The project and bucket names derive from the service account, as infra/storage.tf names them.
name: infra-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra-smoke.yml

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Firestore write and delete
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ steps.auth.outputs.project_id }}
          DOC_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          base="https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/smoke"
          curl --fail-with-body -sS -X POST "${base}?documentId=${DOC_ID}" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d '{"fields":{"source":{"stringValue":"infra-smoke"}}}'
          curl --fail-with-body -sS -X DELETE "${base}/${DOC_ID}" -H "Authorization: Bearer ${TOKEN}"

      - name: Write to completions
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ steps.auth.outputs.project_id }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        # The JSON API create the runner will use: ifGenerationMatch=0 needs only create.
        run: |
          curl --fail-with-body -sS -X POST \
            "https://storage.googleapis.com/upload/storage/v1/b/${PROJECT}-completions/o?uploadType=media&name=smoke%2F${RUN_ID}.txt&ifGenerationMatch=0" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: text/plain" \
            --data-binary "infra-smoke ${RUN_ID}"

      - name: List projections
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          curl --fail-with-body -sS \
            "https://storage.googleapis.com/storage/v1/b/${PROJECT}-projections/o" \
            -H "Authorization: Bearer ${TOKEN}"
