# One run of the hardcoded tracer ticket: the model builds in `model` (model.yml), a job
# holding no token that can open or ready a PR and no credential that can write a run
# record; `pr` opens the draft from the bundled branch with fixed steps only; `record`
# validates the model's summary and writes the run record whatever happened.
# Needs the GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT and GCP_MODEL_SERVICE_ACCOUNT variables
# (infra/README.md) and the OPENCODE_API_KEY secret. Workload Identity Federation trusts main only, so
# dispatch from main.
name: run

on:
  workflow_dispatch:
    inputs:
      model:
        description: opencode model, as provider/model
        type: string
        default: opencode/big-pickle

permissions: {}

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  model:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/model.yml
    permissions:
      contents: read
      id-token: write
    with:
      model: ${{ inputs.model }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  pr:
    needs: model
    if: needs.model.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.open.outputs.url }}
      duration_s: ${{ steps.open.outputs.duration_s }}
    steps:
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}

      - name: Push the branch
        env:
          BRANCH: ${{ needs.model.outputs.branch }}
        run: |
          [[ "$BRANCH" =~ ^wingman/tracer-1-${GITHUB_RUN_ID}-[0-9]+$ ]] || { echo "unexpected branch name"; exit 1; }
          git -c transfer.fsckObjects=true fetch "$RUNNER_TEMP/wingman.bundle" "refs/heads/${BRANCH}:refs/heads/${BRANCH}"
          git push origin "refs/heads/${BRANCH}"

      # The title is Tracer.Title in internal/runner/ticket.go, which the commit also uses.
      - id: open
        name: Open the draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.model.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          url=$(gh pr create --draft --base main --head "$BRANCH" \
            --title "feat(surface): add GET /api/version" \
            --body "Built unattended by forge-wingman from the hardcoded ticket \`tracer-1\`. Run: ${RUN_URL}")
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "duration_s=$(( $(date +%s) - STARTED ))" >> "$GITHUB_OUTPUT"

      # workflow_dispatch is the one GITHUB_TOKEN event that starts a run without approval.
      # The PR is the deliverable, so a failed dispatch leaves CI to be started by hand.
      - name: Start CI on the branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.model.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"

  record:
    needs: [model, pr]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - run: go build -o "$RUNNER_TEMP/runner" ./cmd/runner

      # record exits 1 after writing the record of any run that did not succeed.
      - id: finalize
        name: Finalize the run record
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          RECORD_ID: ${{ needs.model.outputs.record_id }}
          SUMMARY: ${{ needs.model.outputs.summary }}
          PR_URL: ${{ needs.pr.outputs.url }}
          RUN_RESULT: ${{ needs.model.result }}
          PR_RESULT: ${{ needs.pr.result }}
          PR_DURATION: ${{ needs.pr.outputs.duration_s || '0' }}
        run: >-
          "$RUNNER_TEMP/runner" record
          -record-id "$RECORD_ID" -summary "$SUMMARY" -pr-url "$PR_URL"
          -run-result "$RUN_RESULT" -pr-result "$PR_RESULT" -pr-duration-s "$PR_DURATION"

      # A summary too large to pass as an argument fails the step before record runs,
      # so record never reports started; any later failure leaves the record as it is.
      - if: failure() && steps.finalize.outcome == 'failure' && steps.finalize.outputs.started != 'true'
        name: Record an unreadable summary
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          RECORD_ID: ${{ needs.model.outputs.record_id }}
          PR_URL: ${{ needs.pr.outputs.url }}
          RUN_RESULT: ${{ needs.model.result }}
          PR_RESULT: ${{ needs.pr.result }}
          PR_DURATION: ${{ needs.pr.outputs.duration_s || '0' }}
        run: >-
          "$RUNNER_TEMP/runner" record -summary-unreadable
          -record-id "$RECORD_ID" -pr-url "$PR_URL"
          -run-result "$RUN_RESULT" -pr-result "$PR_RESULT" -pr-duration-s "$PR_DURATION"
