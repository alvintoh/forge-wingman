# One run of the ticket in run record `run_id`, job by job: `ticket` reads it from the
# record; `model` (model.yml) builds, holding no GitHub token and no credential that can
# reach a run record; `check` runs the gates on the bundled branch with no token and no
# secret; `pr-meta` renders the PR from the record under the runner identity, derives the
# branch's write set from its bundle and decides draft and auto-merge eligibility; `pr`
# opens the PR with fixed steps, holding GitHub write and no GCP identity; `record`
# validates the model's summary and merges the outcome into the record whatever happened.
# With `stage: plan` (FRG-33) the model job runs the plan phase alone and
# `record-plan-stage` records it instead, while check, pr-meta, pr and record are skipped.
# Needs the GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_MODEL_SERVICE_ACCOUNT and
# WINGMAN_ACCOUNT variables (infra/README.md) and the COMMANDCODE_API_KEY secret; whether
# a PR may auto-merge is the autonomy level the run was claimed at (`runner autonomy`).
# Workload Identity Federation trusts main only, so dispatch from main.
name: run
# The run's title carries the ticket and the stage, and each job's name carries the ticket: the
# failure email lists the jobs by name, so it says which ticket failed.
run-name: ${{ format('run {0}{1}', inputs.run_id, inputs.stage && format(' ({0})', inputs.stage) || '') }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: id of the run record whose ticket to build
        type: string
        required: true
      model:
        description: model, as provider/model; empty uses the default in internal/runner/models.json
        type: string
      review_models:
        description: >-
          the pre-PR loop's review models in order, comma-separated provider/model (FR-14); the first is
          the main model and the rest are backups, used when the one before is unavailable or out of
          allowance. None may be the build model, so the review is never the builder checking its own work.
        type: string
        default: command-code/meta/muse-spark-1.3-contributor
      # The plan phase has its own ordered list: the first entry is the main model and later ones are
      # backups, used when the one before is unavailable or out of allowance.
      plan_models:
        description: >-
          the plan phase's models in order, comma-separated provider/model; the first is the main model
          and the rest are backups, used when the one before is unavailable or out of allowance.
        type: string
        default: command-code/deepseek/deepseek-v4.1-flash
      # stage is the two-stage dispatch's phase (FRG-33): `plan` runs the plan
      # phase alone under the read-only profile and records it; `build` (the
      # default) builds from a plan already recorded. Until the dispatcher sends
      # `plan`, only build runs, so nothing changes.
      stage:
        description: the stage to run — plan or build
        type: string
        default: build
        required: true
      attempt:
        description: the attempt the dispatcher claimed the run at, empty for a run dispatched without one
        type: string
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  ticket:
    name: ticket ${{ inputs.run_id }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      model: ${{ steps.model.outputs.model }}
      # The models the ticket named, empty when it named none.
      override_model: ${{ steps.read.outputs.override_model }}
      override_review_models: ${{ steps.read.outputs.override_review_models }}
      override_plan_models: ${{ steps.read.outputs.override_plan_models }}
      # The checksum of the runner binary this job uploads, which the later jobs verify.
      runner_sha256: ${{ steps.runner.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - id: model
        name: Resolve the model
        env:
          INPUT_MODEL: ${{ inputs.model }}
        run: |
          model="${INPUT_MODEL:-$(jq -r .default internal/runner/models.json)}"
          [[ -n "$model" && "$model" != null ]] || { echo "no default model"; exit 1; }
          echo "model=${model}" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Static, so the model job's egress proxy container can run the binary it mounts. Every
      # later job downloads this build instead of compiling its own (.github/actions/runner-binary).
      - run: go build -o "$RUNNER_TEMP/runner" ./cmd/runner
        env:
          CGO_ENABLED: "0"

      - id: runner
        name: Checksum the runner binary
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/runner" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner
          path: ${{ runner.temp }}/runner
          if-no-files-found: error
          retention-days: 1

      # A missing record or ticket fails here, before any model call; record says why.
      - id: read
        name: Read the ticket
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
        run: '"$RUNNER_TEMP/runner" ticket -run-id "$RUN_ID" -out "$RUNNER_TEMP/ticket.json"'

      # The ticket travels as an artifact, not a job output: GitHub drops any output
      # holding a value masked in this job, which is how a run reaches the model empty.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ticket
          path: ${{ runner.temp }}/ticket.json
          if-no-files-found: error
          retention-days: 1

  model:
    name: model ${{ inputs.run_id }}
    needs: ticket
    uses: ./.github/workflows/model.yml
    permissions:
      contents: read
      id-token: write
    with:
      model: ${{ needs.ticket.outputs.override_model || needs.ticket.outputs.model }}
      review_models: ${{ needs.ticket.outputs.override_review_models || inputs.review_models }}
      plan_models: ${{ needs.ticket.outputs.override_plan_models || inputs.plan_models }}
      stage: ${{ inputs.stage }}
      runner_sha256: ${{ needs.ticket.outputs.runner_sha256 }}
    secrets:
      COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
      # The free-tier plan's key, read only when a run falls through to it. Left
      # unset until the owner adds it (infra/README.md).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # The trusted half of the plan stage (FRG-33): it re-checks the model job's
  # plan, writes it and its base onto the run record, settles the run's plan
  # reservation and wakes the dispatcher for the build stage. It holds the
  # runner identity, since the model job cannot reach a run record.
  #
  # It runs even when the model job failed: a plan stage that stopped wrote no
  # artifact and nothing else would release the reservation it holds, so this job
  # ends the run instead (FRG-88).
  record-plan-stage:
    name: record-plan-stage ${{ inputs.run_id }}
    needs: [ticket, model]
    if: always() && github.ref == 'refs/heads/main' && inputs.stage == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RUN_ID: ${{ inputs.run_id }}
      ATTEMPT: ${{ inputs.attempt }}
      WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: ./.github/actions/runner-binary
        with:
          sha256: ${{ needs.ticket.outputs.runner_sha256 }}

      # A plan stage that stopped wrote no artifact to download: the job below
      # ends its run rather than recording a plan.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.model.result == 'success'
        with:
          name: plan
          path: ${{ runner.temp }}

      - name: Record the plan stage
        if: always()
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          DISPATCHER_RUN_URI: ${{ vars.WINGMAN_DISPATCHER_RUN_URI }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          "$RUNNER_TEMP/runner" record-plan-stage
          -run-id "$RUN_ID" -plan-file "$RUNNER_TEMP/plan.json" -dispatcher-uri "$DISPATCHER_RUN_URI"
          -run-url "$RUN_URL" -plan-stage-result "${{ needs.model.result }}" -attempt "$ATTEMPT"

  # The branch's code runs here, so the job holds nothing it could misuse. Each gate is
  # a fixed step, so the branch cannot redefine one; a failing gate is named, not fatal.
  check:
    name: check ${{ inputs.run_id }}
    needs: model
    if: inputs.stage != 'plan' && needs.model.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No id-token grant is what keeps the runner identity out of the branch's code.
    permissions: {}
    continue-on-error: true
    outputs:
      failed_gate: ${{ steps.gate.outputs.failed_gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/golangci-lint

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}

      # The pattern is branchPattern in internal/runner/build_test.go.
      - name: Check out the branch
        env:
          BRANCH: ${{ needs.model.outputs.branch }}
        run: |
          [[ "$BRANCH" =~ ^wingman/[a-z0-9]+(-[a-z0-9]+)*-${GITHUB_RUN_ID}-[0-9]+$ ]] || { echo "unexpected branch name"; exit 1; }
          git -c transfer.fsckObjects=true fetch "$RUNNER_TEMP/wingman.bundle" "refs/heads/${BRANCH}:refs/heads/${BRANCH}"
          git checkout -q "$BRANCH"

      # The Makefile's check target, a step per gate, named as the runner's gates are.
      - id: gofmt
        continue-on-error: true
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - id: vet
        continue-on-error: true
        run: go vet ./...

      - id: lint
        continue-on-error: true
        run: golangci-lint run

      - id: test
        continue-on-error: true
        run: go test -race -shuffle=on -cover ./...

      - id: gate
        name: Name the failing gate
        env:
          GOFMT: ${{ steps.gofmt.outcome }}
          VET: ${{ steps.vet.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          gate=none
          for g in "gofmt:$GOFMT" "vet:$VET" "golangci-lint:$LINT" "test:$TEST"; do
            [[ "${g#*:}" == success ]] || { gate="${g%%:*}"; break; }
          done
          echo "failed_gate=${gate}" >> "$GITHUB_OUTPUT"

  pr-meta:
    name: pr-meta ${{ inputs.run_id }}
    needs: [ticket, model, check]
    if: ${{ !cancelled() && inputs.stage != 'plan' && needs.model.result == 'success' && needs.model.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      title: ${{ steps.meta.outputs.title }}
      branch_segment: ${{ steps.meta.outputs.branch_segment }}
      body: ${{ steps.meta.outputs.body }}
      auto_merge: ${{ steps.meta.outputs.auto_merge }}
      # draft is the PR's own draft decision (FR-5), which the pr job opens it
      # with: the pre-PR loop's, an edit outside the run's plan, or a
      # concurrent run's plan these files touch.
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The branch's changed files are read out of its bundle, diffed against
          # this main: the bundle carries the commits since the base the branch
          # was cut from, so the checkout must hold main's history whole rather
          # than its tip alone for that base to be there at all.
          fetch-depth: 0

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: ./.github/actions/runner-binary
        with:
          sha256: ${{ needs.ticket.outputs.runner_sha256 }}

      # Nothing on GitHub carries the branch yet — the pr job pushes it — so the
      # write set it produced is read from the bundle the model job uploaded.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}

      # A check job that never named a gate reports "unfinished", which the PR names as check.
      - id: meta
        name: Render the PR from the run record and the build's summary
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          FAILED_GATE: ${{ needs.check.outputs.failed_gate || 'unfinished' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOOP_DETAIL: ${{ needs.model.outputs.loop_detail }}
          ATTEMPT_ID: ${{ needs.model.outputs.attempt_id }}
          SUMMARY: ${{ needs.model.outputs.summary }}
          FRONT_END_PATHS: ${{ vars.WINGMAN_FRONT_END_PATHS }}
          BRANCH: ${{ needs.model.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
          WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
        run: >-
          "$RUNNER_TEMP/runner" pr-meta -run-id "$RUN_ID" -failed-gate "$FAILED_GATE" -run-url "$RUN_URL"
          -loop-detail "$LOOP_DETAIL" -attempt-id "$ATTEMPT_ID" -summary "$SUMMARY"
          -front-end-paths "$FRONT_END_PATHS"
          -bundle "$RUNNER_TEMP/wingman.bundle" -branch "$BRANCH" -repository "$REPOSITORY"

  pr:
    name: pr ${{ inputs.run_id }}
    needs: [model, pr-meta]
    if: ${{ !cancelled() && inputs.stage != 'plan' && needs.model.result == 'success' && needs.model.outputs.changed == 'true' && needs.pr-meta.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents/pull-requests write now come from the App token below, not GITHUB_TOKEN;
    # actions: write is all this job's own token still needs, for the CI dispatch.
    permissions:
      actions: write
    outputs:
      url: ${{ steps.open.outputs.url }}
      duration_s: ${{ steps.open.outputs.duration_s }}
      # Names why the push could not be made, so the record job reports the
      # condition rather than a bare pr job failure.
      stop_reason: ${{ steps.rebase.outputs.stop_reason }}
      auto_merge: ${{ steps.eligible.outputs.labelled }}
    steps:
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # A PR opened with GITHUB_TOKEN always needs a maintainer's manual approval
      # before its own pull_request-triggered workflows run (GitHub's anti-recursion
      # rule, not a repo setting). Minting an installation token from our own App,
      # scoped to just this repo's contents+PRs, avoids that gate entirely.
      - id: app-token
        name: Mint the App's installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WINGMAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.WINGMAN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}

      # The run built on the main current when it was dispatched; main may have
      # moved since. Rebasing onto current main first leaves the pushed branch
      # differing from main only by the run's own commits — a branch still
      # carrying the base's older workflow file reads to GitHub as a workflow
      # change, which this App may not make.
      #
      # The pattern is branchPattern in internal/runner/build_test.go; the prefix pins
      # the branch to the record's ticket.
      - id: rebase
        name: Rebase onto current main
        env:
          BRANCH: ${{ needs.model.outputs.branch }}
          SEGMENT: ${{ needs.pr-meta.outputs.branch_segment }}
          # A rebase writes new commits and a fresh runner has no git identity, so
          # without these it fails exactly when main has moved. They must equal
          # commitAuthorName/Email in internal/runner/identity.go.
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          prefix="wingman/${SEGMENT}-${GITHUB_RUN_ID}-"
          [[ "$BRANCH" =~ ^wingman/[a-z0-9]+(-[a-z0-9]+)*-${GITHUB_RUN_ID}-[0-9]+$ && "$BRANCH" == "$prefix"* && "${BRANCH#"$prefix"}" =~ ^[0-9]+$ ]] \
            || { echo "unexpected branch name"; exit 1; }
          git -c transfer.fsckObjects=true fetch "$RUNNER_TEMP/wingman.bundle" "refs/heads/${BRANCH}:refs/heads/${BRANCH}"
          git fetch --quiet origin main
          git checkout -q "$BRANCH"
          if ! git rebase origin/main; then
            # Only a conflict leaves unmerged paths; any other failure is the job's own.
            conflicted="$(git diff --name-only --diff-filter=U)"
            git rebase --abort
            [[ -n "$conflicted" ]] || { echo "rebase failed without a conflict"; exit 1; }
            echo "stop_reason=rebase-conflict" >> "$GITHUB_OUTPUT"
          fi

      - id: push
        name: Push the branch
        if: steps.rebase.outputs.stop_reason == ''
        env:
          BRANCH: ${{ needs.model.outputs.branch }}
        run: git push origin "refs/heads/${BRANCH}"

      # The bundle artifact is kept, so a hand rebase recovers the run.
      - name: Stop on a conflicting rebase
        if: steps.rebase.outputs.stop_reason != ''
        run: |
          echo "::error::the run's commits conflict with main; rebase the bundle artifact by hand"
          exit 1

      # draft is pr-meta's own decision (FR-5), read from the trusted job rather
      # than from the model job's own claim: the pre-PR loop's, an edit outside
      # the run's plan, or a concurrent run's plan these files touch.
      - id: open
        name: Open the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.model.outputs.branch }}
          TITLE: ${{ needs.pr-meta.outputs.title }}
          BODY: ${{ needs.pr-meta.outputs.body }}
          DRAFT: ${{ needs.pr-meta.outputs.draft }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          draft=(--draft)
          [[ "$DRAFT" != "true" ]] && draft=()
          url=$(gh pr create "${draft[@]}" --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "duration_s=$(( $(date +%s) - STARTED ))" >> "$GITHUB_OUTPUT"

      # The label only marks the PR eligible: pr-review.yml requests auto-merge once its
      # review of the PR is clean. A failed label leaves the PR for the owner.
      - id: eligible
        name: Mark the PR eligible for auto-merge
        if: needs.pr-meta.outputs.auto_merge == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          URL: ${{ steps.open.outputs.url }}
        run: |
          gh pr edit "$URL" --add-label wingman:auto-merge-eligible
          echo "labelled=true" >> "$GITHUB_OUTPUT"

      # workflow_dispatch is the one GITHUB_TOKEN event that starts a run without approval.
      # The PR is the deliverable, so a failed dispatch leaves CI to be started by hand.
      - name: Start CI on the branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.model.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"

  record:
    name: record ${{ inputs.run_id }}
    needs: [ticket, model, check, pr-meta, pr]
    if: always() && inputs.stage != 'plan' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      RUN_ID: ${{ inputs.run_id }}
      ATTEMPT: ${{ inputs.attempt }}
      ATTEMPT_ID: ${{ needs.model.outputs.attempt_id }}
      PR_URL: ${{ needs.pr.outputs.url }}
      RUN_RESULT: ${{ needs.model.result }}
      PR_RESULT: ${{ needs.pr.result }}
      PR_DURATION: ${{ needs.pr.outputs.duration_s || '0' }}
      FAILED_GATE: ${{ needs.check.result != 'skipped' && (needs.check.outputs.failed_gate || 'unfinished') || '' }}
      PR_STOP_REASON: ${{ needs.pr.outputs.stop_reason }}
      AUTO_MERGE: ${{ needs.pr.outputs.auto_merge == 'true' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: ./.github/actions/runner-binary
        with:
          sha256: ${{ needs.ticket.outputs.runner_sha256 }}

      # record exits 1 after writing the record of any run that did not succeed.
      - id: finalize
        name: Finalize the run record
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          SUMMARY: ${{ needs.model.outputs.summary }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          "$RUNNER_TEMP/runner" record
          -run-id "$RUN_ID" -attempt-id "$ATTEMPT_ID" -summary "$SUMMARY" -pr-url "$PR_URL"
          -run-result "$RUN_RESULT" -pr-result "$PR_RESULT" -pr-duration-s "$PR_DURATION"
          -failed-gate "$FAILED_GATE" -pr-stop-reason "$PR_STOP_REASON" -run-url "$RUN_URL"
          -auto-merge="$AUTO_MERGE" -attempt "$ATTEMPT"

      # A summary too large to pass as an argument fails the step before record runs,
      # so record never reports started; any later failure leaves the record as it is.
      - if: failure() && steps.finalize.outcome == 'failure' && steps.finalize.outputs.started != 'true'
        name: Record an unreadable summary
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
        run: >-
          "$RUNNER_TEMP/runner" record -summary-unreadable
          -run-id "$RUN_ID" -attempt-id "$ATTEMPT_ID" -pr-url "$PR_URL"
          -run-result "$RUN_RESULT" -pr-result "$PR_RESULT" -pr-duration-s "$PR_DURATION"
          -failed-gate "$FAILED_GATE" -run-url "$RUN_URL" -attempt "$ATTEMPT"
