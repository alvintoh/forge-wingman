# One run of the ticket in run record `run_id`, job by job: `ticket` reads it from the
# record; `model` (model.yml) builds, holding no GitHub token and no credential that can
# reach a run record; `check` runs the gates on the bundled branch with no token and no
# secret; `pr-meta` renders the PR from the record under the runner identity; `pr` opens
# the draft with fixed steps, holding GitHub write and no GCP identity; `record`
# validates the model's summary and merges the outcome into the record whatever happened.
# Needs the GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_MODEL_SERVICE_ACCOUNT and
# WINGMAN_ACCOUNT variables (infra/README.md) and the OPENCODE_API_KEY secret. Workload
# Identity Federation trusts main only, so dispatch from main.
name: run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: id of the run record whose ticket to build
        type: string
        required: true
      model:
        description: opencode model, as provider/model
        type: string
        default: opencode/big-pickle

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  ticket:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      ticket: ${{ steps.read.outputs.ticket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - run: go build -o "$RUNNER_TEMP/runner" ./cmd/runner

      # A missing record or ticket fails here, before any model call; record says why.
      - id: read
        name: Read the ticket
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
        run: '"$RUNNER_TEMP/runner" ticket -run-id "$RUN_ID"'

  model:
    needs: ticket
    uses: ./.github/workflows/model.yml
    permissions:
      contents: read
      id-token: write
    with:
      model: ${{ inputs.model }}
      ticket: ${{ needs.ticket.outputs.ticket }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  # The branch's code runs here, so the job holds nothing it could misuse. Each gate is
  # a fixed step, so the branch cannot redefine one; a failing gate is named, not fatal.
  check:
    needs: model
    if: needs.model.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No id-token grant is what keeps the runner identity out of the branch's code.
    permissions: {}
    continue-on-error: true
    outputs:
      failed_gate: ${{ steps.gate.outputs.failed_gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The version is ci.yml's golangci-lint-action version.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}

      # The pattern is branchPattern in internal/runner/build_test.go.
      - name: Check out the branch
        env:
          BRANCH: ${{ needs.model.outputs.branch }}
        run: |
          [[ "$BRANCH" =~ ^wingman/[a-z0-9]+(-[a-z0-9]+)*-${GITHUB_RUN_ID}-[0-9]+$ ]] || { echo "unexpected branch name"; exit 1; }
          git -c transfer.fsckObjects=true fetch "$RUNNER_TEMP/wingman.bundle" "refs/heads/${BRANCH}:refs/heads/${BRANCH}"
          git checkout -q "$BRANCH"

      # The Makefile's check target, a step per gate, named as the runner's gates are.
      - id: gofmt
        continue-on-error: true
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - id: vet
        continue-on-error: true
        run: go vet ./...

      - id: lint
        continue-on-error: true
        run: golangci-lint run

      - id: test
        continue-on-error: true
        run: go test -race -shuffle=on -cover ./...

      - id: gate
        name: Name the failing gate
        env:
          GOFMT: ${{ steps.gofmt.outcome }}
          VET: ${{ steps.vet.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          gate=none
          for g in "gofmt:$GOFMT" "vet:$VET" "golangci-lint:$LINT" "test:$TEST"; do
            [[ "${g#*:}" == success ]] || { gate="${g%%:*}"; break; }
          done
          echo "failed_gate=${gate}" >> "$GITHUB_OUTPUT"

  pr-meta:
    needs: [model, check]
    if: ${{ !cancelled() && needs.model.result == 'success' && needs.model.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      title: ${{ steps.meta.outputs.title }}
      branch_segment: ${{ steps.meta.outputs.branch_segment }}
      body: ${{ steps.meta.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - run: go build -o "$RUNNER_TEMP/runner" ./cmd/runner

      # A check job that never named a gate reports "unfinished", which the PR names as check.
      - id: meta
        name: Render the PR from the run record
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          RUN_ID: ${{ inputs.run_id }}
          FAILED_GATE: ${{ needs.check.outputs.failed_gate || 'unfinished' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
        run: >-
          "$RUNNER_TEMP/runner" pr-meta -run-id "$RUN_ID" -failed-gate "$FAILED_GATE" -run-url "$RUN_URL"

  pr:
    needs: [model, pr-meta]
    if: ${{ !cancelled() && needs.model.result == 'success' && needs.model.outputs.changed == 'true' && needs.pr-meta.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.open.outputs.url }}
      duration_s: ${{ steps.open.outputs.duration_s }}
    steps:
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}

      # The pattern is branchPattern in internal/runner/build_test.go; the prefix pins
      # the branch to the record's ticket.
      - name: Push the branch
        env:
          BRANCH: ${{ needs.model.outputs.branch }}
          SEGMENT: ${{ needs.pr-meta.outputs.branch_segment }}
        run: |
          prefix="wingman/${SEGMENT}-${GITHUB_RUN_ID}-"
          [[ "$BRANCH" =~ ^wingman/[a-z0-9]+(-[a-z0-9]+)*-${GITHUB_RUN_ID}-[0-9]+$ && "$BRANCH" == "$prefix"* && "${BRANCH#"$prefix"}" =~ ^[0-9]+$ ]] \
            || { echo "unexpected branch name"; exit 1; }
          git -c transfer.fsckObjects=true fetch "$RUNNER_TEMP/wingman.bundle" "refs/heads/${BRANCH}:refs/heads/${BRANCH}"
          git push origin "refs/heads/${BRANCH}"

      - id: open
        name: Open the draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.model.outputs.branch }}
          TITLE: ${{ needs.pr-meta.outputs.title }}
          BODY: ${{ needs.pr-meta.outputs.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          url=$(gh pr create --draft --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "duration_s=$(( $(date +%s) - STARTED ))" >> "$GITHUB_OUTPUT"

      # workflow_dispatch is the one GITHUB_TOKEN event that starts a run without approval.
      # The PR is the deliverable, so a failed dispatch leaves CI to be started by hand.
      - name: Start CI on the branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.model.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"

  record:
    needs: [ticket, model, check, pr-meta, pr]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RUN_ID: ${{ inputs.run_id }}
      ATTEMPT_ID: ${{ needs.model.outputs.attempt_id }}
      PR_URL: ${{ needs.pr.outputs.url }}
      RUN_RESULT: ${{ needs.model.result }}
      PR_RESULT: ${{ needs.pr.result }}
      PR_DURATION: ${{ needs.pr.outputs.duration_s || '0' }}
      FAILED_GATE: ${{ needs.check.result != 'skipped' && (needs.check.outputs.failed_gate || 'unfinished') || '' }}
      WINGMAN_ACCOUNT: ${{ vars.WINGMAN_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - run: go build -o "$RUNNER_TEMP/runner" ./cmd/runner

      # record exits 1 after writing the record of any run that did not succeed.
      - id: finalize
        name: Finalize the run record
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          SUMMARY: ${{ needs.model.outputs.summary }}
        run: >-
          "$RUNNER_TEMP/runner" record
          -run-id "$RUN_ID" -attempt-id "$ATTEMPT_ID" -summary "$SUMMARY" -pr-url "$PR_URL"
          -run-result "$RUN_RESULT" -pr-result "$PR_RESULT" -pr-duration-s "$PR_DURATION"
          -failed-gate "$FAILED_GATE"

      # A summary too large to pass as an argument fails the step before record runs,
      # so record never reports started; any later failure leaves the record as it is.
      - if: failure() && steps.finalize.outcome == 'failure' && steps.finalize.outputs.started != 'true'
        name: Record an unreadable summary
        env:
          GOOGLE_CLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
        run: >-
          "$RUNNER_TEMP/runner" record -summary-unreadable
          -run-id "$RUN_ID" -attempt-id "$ATTEMPT_ID" -pr-url "$PR_URL"
          -run-result "$RUN_RESULT" -pr-result "$PR_RESULT" -pr-duration-s "$PR_DURATION"
          -failed-gate "$FAILED_GATE"
