# Assigns a pull request to its author when it opens, so every PR has an owner
# whichever tool opened it. pull_request_target runs the copy on main and never
# checks out PR code, so a PR cannot change what runs here.
name: assign-author

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh pr edit "$PR" --repo "$REPO" --add-assignee "$AUTHOR"
